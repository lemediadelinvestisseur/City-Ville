name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Le jeu compilé, publié ensuite sur GitHub Pages (version web jouable sur téléphone).
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # Version web : https://lemediadelinvestisseur.github.io/City-Ville/ (à ajouter à l'écran d'accueil).
  # À activer une fois : GitHub › Settings › Pages › Source : « GitHub Actions ».
  deploy-web:
    name: Déploiement web (GitHub Pages)
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Envoie le serveur (convex/) sur le déploiement de production, seulement depuis main et
  # après les vérifications. Clé : secret CONVEX_DEPLOY_KEY du dépôt (voir docs/MISE_EN_LIGNE.md).
  deploy-convex:
    name: Déploiement Convex
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: convex-production
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Vérifier la clé de déploiement
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY manquant : GitHub › Settings › Secrets and variables › Actions (voir docs/MISE_EN_LIGNE.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx convex deploy --message "commit ${GITHUB_SHA::7}"
