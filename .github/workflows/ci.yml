name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Envoie le serveur (convex/) sur le déploiement de production, seulement depuis main et
  # après les vérifications. Clé : secret CONVEX_DEPLOY_KEY du dépôt (voir docs/MISE_EN_LIGNE.md).
  deploy-convex:
    name: Déploiement Convex
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: convex-production
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Vérifier la clé de déploiement
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY manquant : GitHub › Settings › Secrets and variables › Actions (voir docs/MISE_EN_LIGNE.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx convex deploy --message "commit ${GITHUB_SHA::7}"
